<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Foodie Finder ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Itim", cursive;
      background: #fff5fa;
      color: #5c4650;
    }

    header {
      background: linear-gradient(135deg, #ffb6d9, #ffd6e9);
      padding: 28px 20px;
      text-align: center;
      border-bottom: 4px solid #f49bc5;
    }

    header h1 {
      margin: 0;
      font-size: 42px;
      color: #ffffff;
      text-shadow: 2px 2px #d978aa;
    }

    header p {
      margin: 8px 0 0;
      font-size: 18px;
      color: #ffffff;
    }

    .container {
      width: min(1200px, 92%);
      margin: 25px auto;
    }

    .search-box {
      background: white;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 5px 18px rgba(220, 130, 170, 0.15);
      margin-bottom: 20px;
    }

    .search-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-row input {
      flex: 1;
      min-width: 220px;
      padding: 13px 17px;
      border: 2px solid #f7bdd8;
      border-radius: 15px;
      font-family: inherit;
      font-size: 17px;
      outline: none;
    }

    button,
    select {
      font-family: inherit;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .search-btn {
      background: #f39ac4;
      color: white;
    }

    .random-btn {
      background: #ffd36e;
      color: #654f2a;
    }

    .controls {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .control {
      background: #fff1f7;
      padding: 10px 14px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control select {
      border: 1px solid #f0a9c8;
      border-radius: 10px;
      padding: 7px 10px;
      background: white;
      font-family: inherit;
      font-size: 15px;
    }

    .section-title {
      margin: 28px 0 15px;
      color: #d66b9f;
      font-size: 28px;
    }

    #meals {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .meal-card {
      background: white;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(220, 130, 170, 0.15);
      transition: 0.2s;
    }

    .meal-card:hover {
      transform: translateY(-4px);
    }

    .meal-card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
    }

    .meal-content {
      padding: 16px;
    }

    .meal-content h3 {
      margin: 0 0 8px;
      color: #d45e95;
      font-size: 22px;
    }

    .meal-content p {
      margin: 5px 0;
    }

    .meal-tags {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin: 10px 0;
    }

    .tag {
      background: #ffe5f0;
      color: #c45a89;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 14px;
    }

    .card-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .detail-btn {
      background: #f3a3c8;
      color: white;
      flex: 1;
    }

    .favorite-button {
      background: #ffe0ec;
      color: #d65f92;
    }

    .random-result {
      margin-top: 20px;
    }

    .random-card {
      background: white;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 5px 18px rgba(220, 130, 170, 0.15);
    }

    .random-card img {
      width: 100%;
      max-width: 450px;
      border-radius: 18px;
      display: block;
      margin-bottom: 15px;
    }

    .detail-section {
      background: white;
      padding: 25px;
      border-radius: 22px;
      box-shadow: 0 5px 18px rgba(220, 130, 170, 0.15);
      margin-top: 25px;
      display: none;
    }

    .detail-section img {
      width: 100%;
      max-width: 450px;
      border-radius: 18px;
    }

    .detail-section h2 {
      color: #d45e95;
      font-size: 30px;
    }

    .instructions {
      line-height: 1.8;
      white-space: pre-line;
    }

    .favorites {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }

    .favorite-item {
      background: white;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 4px 15px rgba(220, 130, 170, 0.12);
    }

    .favorite-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 14px;
    }

    .favorite-item h4 {
      color: #d45e95;
      margin: 8px 0;
      font-size: 19px;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      color: #a77b8d;
    }

    .loading {
      text-align: center;
      padding: 30px;
      font-size: 20px;
      color: #d66b9f;
    }

    .error {
      background: #ffe1e8;
      color: #b34c67;
      padding: 15px;
      border-radius: 15px;
      margin-top: 15px;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 40px;
      color: #b97898;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 32px;
      }

      .search-row {
        flex-direction: column;
      }

      .search-row button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🍓 Foodie Finder ♡</h1>
    <p>ค้นหาเมนูอาหารที่อยากกินแบบง่าย ๆ ✨</p>
  </header>

  <div class="container">

    <!-- SEARCH -->
    <div class="search-box">

      <div class="search-row">
        <input
          type="text"
          id="searchInput"
          placeholder="🔍 ค้นหาชื่ออาหาร เช่น chicken, pasta..."
        >

        <button class="search-btn" onclick="searchMeals()">
          🔍 ค้นหา
        </button>

        <button class="random-btn" onclick="randomMeal()">
          🎲 สุ่มเมนู
        </button>
      </div>

      <div class="controls">

        <!-- เอาประเทศออกแล้ว -->

        <div class="control">
          <span>⚙️ Sort</span>

          <select id="sort">
            <option value="selection">Selection Sort</option>
            <option value="insertion">Insertion Sort</option>
            <option value="bubble">Bubble Sort</option>
          </select>
        </div>

        <div class="control">
          <span>↕️ ลำดับ</span>

          <select id="order">
            <option value="asc">A → Z</option>
            <option value="desc">Z → A</option>
          </select>
        </div>

      </div>

      <div id="sortInfo"></div>

      <div id="error"></div>

    </div>


    <!-- RANDOM -->
    <h2 class="section-title">🎲 เมนูสุ่ม</h2>

    <div id="randomResult"></div>


    <!-- MEALS -->
    <h2 class="section-title">🍽️ เมนูอาหาร</h2>

    <section id="meals"></section>


    <!-- DETAIL -->
    <section id="detail" class="detail-section"></section>


    <!-- FAVORITES -->
    <h2 class="section-title">❤️ เมนูโปรด</h2>

    <section id="favorites" class="favorites"></section>

  </div>


  <footer>
    🍓 Foodie Finder ♡ | Powered by TheMealDB
  </footer>


  <script src="dashboard.js"></script>

</body>
</html>
