<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Foodie Finder ♡</title>

  <!-- Font -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Itim&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family:
        "Itim",
        cursive;

      background:
        #fff7fa;

      color:
        #654d57;

    }

    /* =========================================================
       Header
       ========================================================= */

    header {

      background:
        linear-gradient(
          135deg,
          #ffd6e5,
          #ffc1d8
        );

      padding:
        45px 20px;

      text-align:
        center;

      position:
        relative;

      overflow:
        hidden;

    }

    header h1 {

      margin: 0;

      color:
        #a94f75;

      font-size:
        42px;

    }

    header p {

      margin:
        8px 0 0;

      font-size:
        18px;

      color:
        #8e596e;

    }

    /* =========================================================
       Main
       ========================================================= */

    main {

      max-width:
        1100px;

      margin:
        30px auto;

      padding:
        0 20px;

    }

    /* =========================================================
       Search Box
       ========================================================= */

    .search-panel {

      background:
        white;

      border:
        2px solid #ffd6e5;

      border-radius:
        25px;

      padding:
        25px;

      box-shadow:
        0 8px 25px
        rgba(220, 130, 160, 0.12);

    }

    .search-panel h2 {

      margin-top: 0;

      color:
        #a94f75;

    }

    .search-row {

      display:
        flex;

      gap:
        10px;

    }

    #searchInput {

      flex:
        1;

      padding:
        14px 18px;

      border:
        2px solid #ffd3e2;

      border-radius:
        30px;

      font-family:
        "Itim",
        cursive;

      font-size:
        16px;

      outline:
        none;

    }

    button,
    select {

      font-family:
        "Itim",
        cursive;

    }

    .search-button {

      border:
        none;

      background:
        #ef91b2;

      color:
        white;

      border-radius:
        30px;

      padding:
        0 25px;

      font-size:
        16px;

      cursor:
        pointer;

    }

    .search-button:hover {

      background:
        #e47da2;

    }

    /* =========================================================
       Controls
       ========================================================= */

    .controls {

      display:
        flex;

      gap:
        15px;

      flex-wrap:
        wrap;

      margin-top:
        18px;

      align-items:
        center;

    }

    .control {

      display:
        flex;

      align-items:
        center;

      gap:
        8px;

    }

    select {

      padding:
        9px 14px;

      border:
        2px solid #ffd3e2;

      border-radius:
        20px;

      background:
        white;

      color:
        #765866;

      cursor:
        pointer;

    }

    #sortInfo {

      margin-left:
        auto;

      color:
        #b46b88;

      font-size:
        16px;

    }

    /* =========================================================
       Random
       ========================================================= */

    .random-section {

      margin-top:
        25px;

      text-align:
        center;

    }

    #randomButton {

      border:
        none;

      background:
        #f5a8c4;

      color:
        white;

      padding:
        12px 28px;

      border-radius:
        30px;

      font-size:
        17px;

      cursor:
        pointer;

      box-shadow:
        0 5px 12px
        rgba(220, 120, 160, 0.2);

    }

    #randomButton:hover {

      transform:
        translateY(-2px);

    }

    #randomResult {

      margin-top:
        18px;

    }

    .random-card {

      display:
        flex;

      max-width:
        650px;

      margin:
        auto;

      background:
        white;

      border:
        2px solid #ffd4e3;

      border-radius:
        22px;

      overflow:
        hidden;

      text-align:
        left;

    }

    .random-card img {

      width:
        230px;

      object-fit:
        cover;

    }

    .random-card div {

      padding:
        20px;

    }

    .random-card span {

      color:
        #df82a4;

    }

    .random-card h2 {

      color:
        #a94f75;

      margin:
        5px 0;

    }

    /* =========================================================
       Menu
       ========================================================= */

    .section-title {

      margin:
        35px 0 18px;

      color:
        #a94f75;

    }

    #meals {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        22px;

    }

    .meal-card {

      background:
        white;

      border:
        2px solid #ffdce8;

      border-radius:
        22px;

      overflow:
        hidden;

      position:
        relative;

      box-shadow:
        0 7px 20px
        rgba(210, 120, 150, 0.1);

      transition:
        0.2s;

    }

    .meal-card:hover {

      transform:
        translateY(-4px);

    }

    .meal-card > img {

      width:
        100%;

      height:
        210px;

      object-fit:
        cover;

    }

    /* อันดับ */
    .rank {

      position:
        absolute;

      top:
        12px;

      left:
        12px;

      background:
        rgba(255,255,255,0.9);

      color:
        #bd6689;

      padding:
        5px 12px;

      border-radius:
        20px;

      z-index:
        2;

    }

    .meal-info {

      padding:
        16px;

    }

    .meal-info h3 {

      margin:
        0 0 10px;

      color:
        #684d59;

      font-size:
        21px;

    }

    .meal-tags {

      display:
        flex;

      gap:
        6px;

      flex-wrap:
        wrap;

      margin-bottom:
        12px;

    }

    .tag {

      background:
        #fff0f5;

      color:
        #c46d8d;

      padding:
        5px 10px;

      border-radius:
        50px;

      font-size:
        13px;

    }

    /* =========================================================
       Buttons
       ========================================================= */

    .card-buttons {

      display:
        flex;

      gap:
        8px;

    }

    .favorite-button {

      width:
        45px;

      border:
        2px solid #f5b1c9;

      background:
        white;

      color:
        #e98baa;

      border-radius:
        50%;

      font-size:
        20px;

      cursor:
        pointer;

    }

    .favorite-button.active {

      background:
        #fff0f5;

    }

    .detail-button {

      flex:
        1;

      border:
        none;

      background:
        #f5a8c4;

      color:
        white;

      padding:
        10px;

      border-radius:
        30px;

      font-size:
        15px;

      cursor:
        pointer;

    }

    .detail-button:hover {

      background:
        #eb8eaf;

    }

    /* =========================================================
       Detail
       ========================================================= */

    #detail {

      margin-top:
        30px;

    }

    .detail-content {

      background:
        white;

      border:
        2px solid #ffd6e5;

      border-radius:
        25px;

      padding:
        25px;

      display:
        flex;

      gap:
        25px;

    }

    .detail-content img {

      width:
        320px;

      height:
        320px;

      object-fit:
        cover;

      border-radius:
        20px;

    }

    .detail-content h2 {

      color:
        #a94f75;

    }

    .instructions {

      line-height:
        1.8;

      white-space:
        pre-line;

    }

    /* =========================================================
       Favorites
       ========================================================= */

    .favorites-section {

      margin-top:
        35px;

      background:
        white;

      border:
        2px solid #ffd6e5;

      border-radius:
        25px;

      padding:
        22px;

    }

    .favorite-item {

      display:
        flex;

      align-items:
        center;

      gap:
        12px;

      padding:
        10px 0;

      border-bottom:
        1px solid #ffe5ed;

    }

    .favorite-item:last-child {

      border-bottom:
        none;

    }

    .favorite-item img {

      width:
        60px;

      height:
        60px;

      object-fit:
        cover;

      border-radius:
        12px;

    }

    .favorite-item div {

      flex:
        1;

      display:
        flex;

      flex-direction:
        column;

    }

    .favorite-item small {

      color:
        #b87b91;

    }

    .favorite-item button {

      border:
        none;

      background:
        #f7b1c9;

      color:
        white;

      border-radius:
        20px;

      padding:
        7px 15px;

      cursor:
        pointer;

    }

    .favorite-item .remove-favorite {

      background:
        #f3d2dc;

      color:
        #a85e78;

    }

    /* =========================================================
       Empty / Error
       ========================================================= */

    .empty {

      background:
        white;

      border:
        2px dashed #f2bfd1;

      border-radius:
        20px;

      padding:
        30px;

      text-align:
        center;

      color:
        #bd8198;

      grid-column:
        1 / -1;

    }

    #error {

      display:
        none;

      max-width:
        1100px;

      margin:
        15px auto;

      padding:
        12px 20px;

      background:
        #ffe3ea;

      color:
        #c65d7d;

      border-radius:
        15px;

    }

    /* =========================================================
       Responsive
       ========================================================= */

    @media (max-width: 800px) {

      #meals {

        grid-template-columns:
          repeat(2, 1fr);

      }

      #sortInfo {

        width:
          100%;

        margin-left:
          0;

      }

      .detail-content {

        flex-direction:
          column;

      }

      .detail-content img {

        width:
          100%;

      }

    }

    @media (max-width: 550px) {

      #meals {

        grid-template-columns:
          1fr;

      }

      .search-row {

        flex-direction:
          column;

      }

      .search-button {

        padding:
          12px;

      }

      .random-card {

        flex-direction:
          column;

      }

      .random-card img {

        width:
          100%;

      }

    }

  </style>

</head>

<body>

  <!-- =========================================================
       Header
       ========================================================= -->

  <header>

    <h1>
      🍓 Foodie Finder ♡
    </h1>

    <p>
      ค้นหาเมนูอร่อย ๆ ที่อยากกินวันนี้ ✿
    </p>

  </header>


  <div id="error"></div>


  <main>

    <!-- =======================================================
         Search
         ======================================================= -->

    <section class="search-panel">

      <h2>
        🔍 วันนี้อยากกินอะไรดี?
      </h2>

      <div class="search-row">

        <input
          id="searchInput"
          type="text"
          placeholder="ลองพิมพ์ เช่น chicken, pasta..."
        >

        <button
          class="search-button"
          onclick="searchMeals()"
        >
          ค้นหา ♡
        </button>

      </div>


      <!-- Controls -->

      <div class="controls">

        <div class="control">

          <span>
            🌎 ประเทศ
          </span>

          <select id="country">

            <option value="">
              ทั้งหมด
            </option>

          </select>

        </div>


        <div class="control">

          <span>
            🔀 Sort
          </span>

          <select id="algo">

            <option value="selection">
              Selection Sort
            </option>

            <option value="insertion">
              Insertion Sort
            </option>

            <option value="bubble">
              Bubble Sort
            </option>

          </select>

        </div>


        <div class="control">

          <span>
            ↕️ เรียง
          </span>

          <select id="order">

            <option value="asc">
              A → Z
            </option>

            <option value="desc">
              Z → A
            </option>

          </select>

        </div>


        <div id="sortInfo">

          🔀 Selection Sort • A → Z

        </div>

      </div>

    </section>


    <!-- =======================================================
         Random
         ======================================================= -->

    <section class="random-section">

      <button
        id="randomButton"
        onclick="randomMeal()"
      >
        🎲 วันนี้กินอะไรดี?
      </button>

      <div id="randomResult"></div>

    </section>


    <!-- =======================================================
         Meals
         ======================================================= -->

    <h2 class="section-title">
      🍰 เมนูแนะนำ
    </h2>

    <section id="meals"></section>


    <!-- =======================================================
         Detail
         ======================================================= -->

    <section id="detail"></section>


    <!-- =======================================================
         Favorites
         ======================================================= -->

    <section class="favorites-section">

      <h2 class="section-title">
        ❤️ เมนูโปรดของฉัน
      </h2>

      <div id="favorites">

        <p class="empty">
          ♡ ยังไม่มีเมนูโปรด
        </p>

      </div>

    </section>

  </main>


  <script src="dashboard.js"></script>

</body>

</html>
